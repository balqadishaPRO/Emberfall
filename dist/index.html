<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#16261e"><meta name="description" content="Seven heroes, one bounded wood, and an endless survival challenge. A lightweight 2D browser game."><title>Emberfall — The Hollow Wood</title><link rel="stylesheet" href="survival.css?v=ember-6"></head>
<body><div id="game-root"><canvas id="game" tabindex="0" aria-label="Survival arena. WASD or arrows to move. Space uses your class ability."></canvas>
<header class="topbar"><a class="brand" href="./">✧ EMBERFALL</a><nav><button id="codex" aria-label="Field guide" title="Field guide">☷</button><button id="sound" aria-label="Mute audio (M)" title="Mute audio (M)">♪</button><button id="settings" aria-label="Audio settings" title="Audio settings">⚙</button><button id="fullscreen" aria-label="Enter fullscreen" title="Fullscreen (F)">⛶</button><button id="pause" aria-label="Pause game" disabled>Ⅱ</button></nav></header>
<section id="run-hud" class="run-hud" aria-label="Run status" hidden>
<div class="hud-heading"><strong id="hero-name">Archer</strong><span id="shield-text"></span><span id="protection" hidden></span></div>
<div class="health-row"><div id="health-track" class="health-track" role="progressbar" aria-label="Health"><div id="health-fill"></div></div><strong id="health-text">100 / 100</strong></div>
<div class="xp-track" role="progressbar" aria-label="Experience" id="xp-track"><div id="xp-fill"></div></div>
<div class="micro-stats"><span>LV <b id="level">1</b></span><span id="time">00:00</span><span><b id="kills">0</b> kills</span></div>
<div class="skill-row"><button id="active-button" class="active-button" aria-label="Use class ability"><span id="active-icon">➶</span><small id="active-seconds">READY</small><kbd>SPACE</kbd></button><div class="skill-caption"><strong id="active-name">Scattershot</strong><small id="active-state">Ready</small></div><button id="build-button" title="View build (B)">Build</button></div>
<div class="next-event"><span id="event-label">MINIBOSS</span><span id="event-time">00:45</span></div><div id="announcement" role="status" hidden></div>
</section>
<div id="joystick" class="joystick"><div id="stick"></div></div><div id="overlay" class="overlay"></div></div>
<dialog id="guide-dialog"><button class="close" aria-label="Close field guide">×</button><div class="eyebrow">KNOW THE WOOD</div><h2>Field guide</h2><div class="guide-tabs"><button id="abilities-tab" class="selected">Abilities</button><button id="monsters-tab">Monsters & bosses</button><button id="controls-tab">How to play</button></div><div id="guide-content"></div></dialog>
<dialog id="build-dialog"><button class="close" aria-label="Close build">×</button><div class="eyebrow">YOUR CURRENT RUN</div><h2 id="build-title">Your build</h2><div id="build-stats" class="build-stats"></div><div id="build-details" class="guide-grid"></div></dialog>
<dialog id="audio-dialog"><button class="close" aria-label="Close audio settings">×</button><div class="eyebrow">SOUND</div><h2>Audio settings</h2><p class="guide-help">Your run is paused. Settings are saved on this device.</p><label class="volume-label" for="music-volume">Background music <output id="music-value">32%</output></label><input id="music-volume" type="range" min="0" max="100" value="32"><label class="volume-label" for="effects-volume">Combat & interface <output id="effects-value">60%</output></label><input id="effects-volume" type="range" min="0" max="100" value="60"><label class="mute-label"><input id="audio-mute" type="checkbox"> Mute all audio <kbd>M</kbd></label></dialog>
<div id="live-region" class="sr-only" role="status" aria-live="polite"></div><script src="survival.mjs?v=ember-6" type="module"></script></body></html>
