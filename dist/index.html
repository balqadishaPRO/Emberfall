<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#101916"><meta name="description" content="Choose your hero, assemble an elemental build, summon companions, and survive the finite Hollow Wood arena."><title>Emberfall — The Hollow Wood</title><link rel="stylesheet" href="survival.css?v=ember-3"></head>
<body><div id="game-root"><canvas id="game" tabindex="0" aria-label="Survival arena. Move with WASD or arrow keys. Attacks are automatic."></canvas>
<header class="topbar"><a class="brand" href="./"><span>✧</span> EMBERFALL <small>THE HOLLOW WOOD</small></a><nav><button id="codex" title="Abilities and monster guide">Field guide <span>☷</span></button><button id="sound" aria-label="Enable sound">♪ OFF</button><button id="fullscreen" aria-label="Enter fullscreen" title="Fullscreen (F)">⛶ <span>Fullscreen</span></button><button id="pause" aria-label="Pause game" disabled>Ⅱ</button></nav></header>
<div id="run-hud" class="run-hud" hidden><div class="stats-strip"><div><span>SURVIVED</span><strong id="time">00:00</strong></div><div><span>KILLS</span><strong id="kills">0</strong></div><div><span>WAVE</span><strong id="wave">01</strong></div><div><span>LEVEL</span><strong id="level">01</strong></div><div class="next-event"><span id="event-label">MINIBOSS IN</span><strong id="event-time">00:45</strong></div></div><div id="boss-bars"></div><div id="announcement" class="event-banner" hidden role="status"></div></div>
<div id="bottom-hud" class="bottom-hud combat-dock" hidden><div class="dock-main"><div class="dock-avatar" id="hero-icon">?</div><div class="dock-vitals"><div class="dock-heading"><strong id="hero-name">Archer</strong><span id="shield-text"></span><strong id="health-text">100 / 100</strong><small>HP</small></div><div class="health-track" id="health-track" role="progressbar" aria-label="Health"><div id="health-ghost"></div><div id="health-fill"></div></div><div class="xp-track"><div id="xp-fill"></div></div><div class="xp-label"><span id="xp-level">LEVEL 1</span><span id="recovery-state"></span><span id="xp-count">0 / 9 XP</span></div></div><button id="active-button" class="active-button" aria-label="Use class ability (Space)"><span class="active-charge"><span class="active-inner"><span id="active-icon">?</span><span id="active-seconds">READY</span></span></span><kbd>SPACE</kbd></button></div><div class="dock-passives"><div id="build" class="build-strip" aria-label="Your passive abilities"></div><button id="build-button">Build <kbd>B</kbd></button></div><div class="active-caption"><strong id="active-name">Piercing volley</strong><span id="active-state">Class ability ready</span></div></div>
<div id="map-label" class="map-label" hidden>THE HOLLOW WOOD <span>2200 × 1600 · BOUNDED ARENA</span></div><div id="joystick" class="joystick"><div id="stick"></div></div><div id="overlay" class="overlay"></div>
</div>
<dialog id="guide-dialog"><button class="close" aria-label="Close field guide">×</button><div class="eyebrow">THE EMBERKEEPER’S COMPANION</div><h2>Field guide</h2><div class="guide-tabs"><button id="abilities-tab" class="selected">Abilities</button><button id="monsters-tab">Monsters & bosses</button><button id="controls-tab">How to play</button></div><div id="guide-content"></div></dialog>
<dialog id="build-dialog"><button class="close" aria-label="Close build">×</button><div class="eyebrow">YOUR CURRENT RUN</div><h2 id="build-title">Your build</h2><div id="build-stats" class="build-stats"></div><div id="build-details" class="guide-grid"></div></dialog>
<div id="live-region" class="sr-only" role="status" aria-live="polite"></div><script src="survival.mjs?v=ember-3" type="module"></script></body></html>
