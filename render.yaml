services:
  - type: web
    name: emberfall
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev && npm run db:migrate
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
